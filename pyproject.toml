[project]
name = "enterprise-work-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "pdfplumber==0.11.9",
    "pymupdf>=2.2",
    "python-hwpx>=7.0.1,<8",
    "streamlit>=1.67.0,<2",
]

[project.optional-dependencies]
inference = [
    "torch==2.9.1",
    "transformers==4.57.6",
    "accelerate>=1.10,<2",
]
training = [
    "torch==2.9.1",
    "transformers==4.57.6",
    "accelerate>=1.10,<2",
    "peft==0.18.0",
    "bitsandbytes==0.48.2",
]

# NVIDIA Windows/Linux 환경에서 CPU 전용 torch가 설치되지 않도록 지정합니다.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
